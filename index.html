<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPEARICH — Future Cambridge-Inspired LMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appearichGold: '#FFD600',
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 font-sans selection:bg-[#FFD600] selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [userName, setUserName] = useState('Edwin');
            const [currentTab, setCurrentTab] = useState('Home');
            const [activeSubView, setActiveSubView] = useState(null);

            // Persistent Hero Image State inspired by layout reference
            const [heroImage, setHeroImage] = useState('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=1200');
            const [showHeroMenu, setShowHeroMenu] = useState(false);
            const fileInputRef = useRef(null);

            const handleLogin = (name) => {
                if (name.trim()) setUserName(name.trim());
                setIsLoggedIn(true);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentTab('Home');
                setActiveSubView(null);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setHeroImage(reader.result);
                        setShowHeroMenu(false);
                    };
                    reader.readAsDataURL(file);
                }
            };

            if (!isLoggedIn) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white text-neutral-900 flex flex-col justify-between shadow-2xl relative pb-24">
                    
                    {/* Top Header layout matching image reference */}
                    <header className="flex justify-between items-center px-6 pt-5 pb-3">
                        <div 
                            onClick={() => setActiveSubView(null)}
                            className="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center cursor-pointer hover:bg-neutral-50 shadow-sm text-sm font-bold"
                        >
                            ←
                        </div>
                        <div className="flex items-center space-x-2 font-black text-lg tracking-tight">
                            <span className="w-6 h-6 bg-black text-[#FFD600] rounded-md flex items-center justify-center text-xs shadow-sm font-mono">◆</span>
                            <span className="font-extrabold text-black">Appearich</span>
                        </div>
                        <div className="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center cursor-pointer hover:bg-neutral-50 shadow-sm text-sm">
                            🌙
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-y-auto">
                        {currentTab === 'Home' && !activeSubView && (
                            <HomeScreen 
                                userName={userName} 
                                heroImage={heroImage} 
                                showHeroMenu={showHeroMenu}
                                setShowHeroMenu={setShowHeroMenu}
                                fileInputRef={fileInputRef}
                                handleImageUpload={handleImageUpload}
                                setHeroImage={setHeroImage}
                                setActiveSubView={setActiveSubView}
                            />
                        )}

                        {currentTab === 'Home' && activeSubView === 'academics' && <AcademicsView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'events' && <EventsView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'sports' && <SportsView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'library' && <LibraryView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'community' && <CommunityView onBack={() => setActiveSubView(null)} />}

                        {currentTab === 'AI Guide' && <AICampanionView userName={userName} />}
                        {currentTab === 'Bookings' && <ActivityJourneyView />}
                        {currentTab === 'Profile' && <ProfileView userName={userName} heroImage={heroImage} onLogout={handleLogout} />}
                    </main>

                    {/* Hidden file input */}
                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />

                    {/* Bottom Navigation matching image reference EXACTLY: Home, AI Guide, Bookings, Profile */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-neutral-200 px-6 py-3 flex justify-between items-center z-30 shadow-lg">
                        {[
                            { name: 'Home', icon: '🏠' },
                            { name: 'AI Guide', icon: '🤖' },
                            { name: 'Bookings', icon: '💼' },
                            { name: 'Profile', icon: '👤' }
                        ].map((tab) => (
                            <button 
                                key={tab.name}
                                onClick={() => { setCurrentTab(tab.name); setActiveSubView(null); }}
                                className={`flex flex-col items-center space-y-1 transition-all ${currentTab === tab.name ? 'text-[#FFD600] font-black' : 'text-neutral-400 hover:text-neutral-700'}`}
                            >
                                <span className={`text-xl ${currentTab === tab.name ? 'scale-110' : ''}`}>{tab.icon}</span>
                                <span className="text-[10px] tracking-tight">{tab.name}</span>
                            </button>
                        ))}
                    </nav>

                </div>
            );
        }

        // LOGIN SCREEN
        function LoginScreen({ onLogin }) {
            const [nameInput, setNameInput] = useState('Edwin');

            return (
                <div className="max-w-md mx-auto min-h-screen bg-black text-white flex flex-col justify-between p-8 relative overflow-hidden">
                    <div className="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-[#FFD600]/10 blur-3xl pointer-events-none"></div>
                    
                    <div className="space-y-2 pt-12 z-10">
                        <div className="inline-block bg-[#FFD600] text-black font-mono text-[10px] px-2 py-1 font-bold">
                            [ CAMBRIDGE DIGITAL CAMPUS ]
                        </div>
                        <h1 className="text-5xl font-black tracking-tighter leading-none text-white">
                            APPEARICH<span className="text-[#FFD600]">.</span>
                        </h1>
                        <p className="text-sm text-neutral-400 font-medium pt-2">
                            The Future of Learning. Sophisticated academic intelligence combined with immersive 3D architecture.
                        </p>
                    </div>

                    <div className="space-y-6 z-10 my-auto">
                        <div className="space-y-2">
                            <label className="text-xs font-mono text-neutral-400 uppercase tracking-widest">Enter Student Name</label>
                            <input 
                                type="text"
                                value={nameInput}
                                onChange={(e) => setNameInput(e.target.value)}
                                placeholder="e.g. Edwin"
                                className="w-full bg-neutral-900 border border-neutral-800 rounded-2xl px-4 py-4 text-white font-bold text-base focus:outline-none focus:border-[#FFD600] transition-colors"
                            />
                        </div>
                        <button 
                            onClick={() => onLogin(nameInput)}
                            className="w-full bg-[#FFD600] text-black font-black py-4 rounded-2xl tracking-wider text-sm hover:bg-white transition-all shadow-lg shadow-[#FFD600]/20 flex items-center justify-center space-x-2"
                        >
                            <span>ENTER DIGITAL CAMPUS</span>
                            <span>→</span>
                        </button>
                    </div>

                    <div className="text-center text-[10px] font-mono text-neutral-500 z-10">
                        SECURE CAMBRIDGE AUTHENTICATION v2.6
                    </div>
                </div>
            );
        }

        // HOME SCREEN FOLLOWING EXACT STRUCTURE OF IMAGE REFERENCE
        function HomeScreen({ 
            userName, 
            heroImage, 
            showHeroMenu, 
            setShowHeroMenu, 
            fileInputRef, 
            setHeroImage,
            setActiveSubView 
        }) {
            const [searchQuery, setSearchQuery] = useState('');
            const [isSearchExpanded, setIsSearchExpanded] = useState(false);

            return (
                <div className="px-5 py-4 space-y-6 animate-fadeIn">
                    
                    {/* Heroic Personal Image Environment with Cover Control Menu */}
                    <div className="relative rounded-3xl overflow-hidden bg-neutral-900 text-white shadow-xl h-52 flex flex-col justify-end group">
                        {heroImage ? (
                            <img src={heroImage} className="absolute inset-0 w-full h-full object-cover opacity-75 group-hover:scale-105 transition-transform duration-700" />
                        ) : (
                            <div className="absolute inset-0 bg-gradient-to-br from-neutral-900 to-neutral-800"></div>
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                        
                        {/* Change Cover Menu Button */}
                        <div className="absolute top-4 right-4 z-20">
                            <button 
                                onClick={() => setShowHeroMenu(!showHeroMenu)}
                                className="bg-black/60 backdrop-blur-md border border-white/20 text-white text-[10px] font-mono px-3 py-1.5 rounded-full hover:bg-black transition-colors flex items-center space-x-1"
                            >
                                <span>⚙ Change Cover</span>
                            </button>

                            {showHeroMenu && (
                                <div className="absolute right-0 mt-2 w-48 bg-black border border-neutral-800 rounded-2xl shadow-2xl py-2 z-30 text-xs font-medium space-y-1">
                                    <button 
                                        onClick={() => { fileInputRef.current.click(); setShowHeroMenu(false); }}
                                        className="w-full text-left px-4 py-2 hover:bg-neutral-900 text-white flex items-center space-x-2"
                                    >
                                        <span>📁 Upload / Replace image</span>
                                    </button>
                                    <button 
                                        onClick={() => { setHeroImage(''); setShowHeroMenu(false); }}
                                        className="w-full text-left px-4 py-2 hover:bg-neutral-900 text-red-400 flex items-center space-x-2"
                                    >
                                        <span>✕ Remove image</span>
                                    </button>
                                    <button 
                                        onClick={() => { setHeroImage('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=1200'); setShowHeroMenu(false); }}
                                        className="w-full text-left px-4 py-2 hover:bg-neutral-900 text-[#FFD600] flex items-center space-x-2"
                                    >
                                        <span>↺ Restore default hero</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Greeting matching layout reference */}
                        <div className="relative z-10 p-6 space-y-1">
                            <h1 className="text-2xl font-black tracking-tight text-white">Welcome, {userName}!</h1>
                            <p className="text-xs text-[#FFD600] font-semibold tracking-wide">
                                Appear Rich — Premium Delivery, Delivered with Love.
                            </p>
                        </div>
                    </div>

                    {/* WE OFFER THIS Section matching layout reference */}
                    <div className="space-y-3">
                        <div className="flex items-center space-x-2 text-xs font-black tracking-wider text-neutral-800 uppercase">
                            <span>📚</span>
                            <span>WE OFFER THIS</span>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            {/* Hot Meals Card matching reference */}
                            <div 
                                onClick={() => setActiveSubView('academics')}
                                className="relative rounded-3xl overflow-hidden h-40 bg-neutral-900 text-white p-4 flex flex-col justify-end shadow-md cursor-pointer group"
                            >
                                <div className="absolute inset-0 bg-cover bg-center opacity-70 group-hover:scale-105 transition-transform duration-500" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&q=80&w=600')` }}></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                                <div className="relative z-10">
                                    <h3 className="font-black text-lg text-white">Hot Meals</h3>
                                    <p className="text-[10px] text-[#FFD600] font-semibold mt-0.5">Fastest Sourced Food</p>
                                </div>
                            </div>

                            {/* Perfumes Card matching reference */}
                            <div 
                                onClick={() => setActiveSubView('library')}
                                className="relative rounded-3xl overflow-hidden h-40 bg-neutral-900 text-white p-4 flex flex-col justify-end shadow-md cursor-pointer group"
                            >
                                <div className="absolute inset-0 bg-cover bg-center opacity-70 group-hover:scale-105 transition-transform duration-500" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&q=80&w=600')` }}></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                                <div className="relative z-10">
                                    <h3 className="font-black text-lg text-white">Perfumes</h3>
                                    <p className="text-[10px] text-[#FFD600] font-semibold mt-0.5">Luxury Fragrances</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Need Anything Specific? Card matching layout reference */}
                    <div className="bg-white border border-neutral-200/80 rounded-3xl p-5 shadow-sm space-y-3">
                        <div className="flex items-center space-x-2 text-xs font-black text-neutral-900">
                            <span>❓</span>
                            <span>Need Anything Specific?</span>
                        </div>
                        <p className="text-xs text-neutral-500 leading-relaxed font-medium">
                            Describe your needs, custom order details, or ask any question directly.
                        </p>
                        <div className="flex items-center border border-neutral-200 rounded-2xl bg-neutral-50 px-3 py-1.5 space-x-2 focus-within:border-neutral-400">
                            <input 
                                type="text" 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Type your request here..."
                                className="bg-transparent text-xs flex-1 focus:outline-none text-neutral-800 placeholder:text-neutral-400 py-2"
                            />
                            <button className="bg-[#FFD600] text-black font-black text-xs px-5 py-2.5 rounded-xl hover:bg-amber-400 transition-all shadow-sm">
                                Ask
                            </button>
                        </div>
                    </div>

                    {/* Quick Reorder Card matching layout reference */}
                    <div className="bg-white border border-neutral-200/80 rounded-3xl p-4 shadow-sm flex items-center justify-between">
                        <div className="flex items-center space-x-3.5">
                            <div className="w-11 h-11 rounded-2xl bg-[#FFD600]/20 text-neutral-900 font-black flex items-center justify-center text-base shrink-0">
                                🔄
                            </div>
                            <div>
                                <h4 className="font-black text-sm text-neutral-900">Quick Reorder</h4>
                                <p className="text-[11px] text-neutral-500 mt-0.5 font-medium">Repeat your last saved order instantly</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => setActiveSubView('events')}
                            className="border border-[#FFD600] px-5 py-2 rounded-2xl text-xs font-black text-neutral-900 hover:bg-[#FFD600] transition-all"
                        >
                            Reorder
                        </button>
                    </div>

                </div>
            );
        }

        // AI COMPANION VIEW
        function AICampanionView({ userName }) {
            const [messages, setMessages] = useState([
                { sender: 'ai', text: `Hello ${userName}. I'm your Cambridge AI Academic Mentor. You've improved your mathematics performance by 18% this month. I recommend revisiting integration before Friday's lecture.` }
            ]);
            const [input, setInput] = useState('');

            const handleSend = () => {
                if (!input.trim()) return;
                const userMsg = input;
                setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setInput('');

                setTimeout(() => {
                    setMessages(prev => [
                        ...prev, 
                        { sender: 'ai', text: `Analyzing "${userMsg}" through our Cambridge curriculum model. Based on your learning graph, let's break this down into core conceptual milestones...` }
                    ]);
                }, 800);
            };

            return (
                <div className="p-6 space-y-6 flex flex-col h-[calc(100vh-120px)] justify-between">
                    <div className="space-y-4">
                        <div className="flex items-center justify-between border-b border-neutral-100 pb-3">
                            <div className="flex items-center space-x-2">
                                <div className="w-3 h-3 rounded-full bg-[#FFD600] animate-pulse"></div>
                                <h2 className="font-black text-sm tracking-tight">APPEARICH AI GUIDE</h2>
                            </div>
                            <span className="text-[10px] font-mono bg-neutral-100 px-2 py-0.5 rounded-full">SOCRATIC ENGINE</span>
                        </div>

                        {/* AI Core Interactive Simulation Header */}
                        <div className="bg-black text-white rounded-3xl p-6 text-center relative overflow-hidden shadow-lg space-y-3">
                            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-neutral-800 via-black to-black opacity-60"></div>
                            <div className="relative z-10 w-16 h-16 mx-auto rounded-full bg-[#FFD600]/20 border-2 border-[#FFD600] flex items-center justify-center animate-pulse">
                                <span className="text-2xl">✦</span>
                            </div>
                            <div className="relative z-10">
                                <h4 className="font-black text-sm text-[#FFD600]">KNOWLEDGE IN MOTION</h4>
                                <p className="text-[10px] text-neutral-400 mt-0.5">Real-time academic telemetry active</p>
                            </div>
                        </div>

                        {/* Chat Messages */}
                        <div className="space-y-3 overflow-y-auto max-h-52 pr-1">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-2xl p-4 text-xs font-medium leading-relaxed ${m.sender === 'user' ? 'bg-[#FFD600] text-black font-bold' : 'bg-neutral-100 text-black border border-neutral-200'}`}>
                                        <div className="text-[9px] font-mono opacity-60 mb-1">{m.sender === 'user' ? userName.toUpperCase() : 'APPEARICH AI'}</div>
                                        {m.text}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Input Bar */}
                    <div className="pt-2">
                        <div className="flex items-center border-2 border-neutral-200 rounded-2xl bg-neutral-50 px-3 py-2 space-x-2 focus-within:border-black transition-colors">
                            <input 
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                                placeholder="Ask AI anything about your orders or studies..."
                                className="bg-transparent text-xs flex-1 focus:outline-none text-black placeholder:text-neutral-400"
                            />
                            <button 
                                onClick={handleSend}
                                className="bg-black text-[#FFD600] font-black text-xs px-4 py-2 rounded-xl hover:bg-[#FFD600] hover:text-black transition-all"
                            >
                                Ask
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // BOOKINGS / ACTIVITY JOURNEY VIEW
        function ActivityJourneyView() {
            return (
                <div className="p-6 space-y-6">
                    <div className="space-y-1">
                        <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest">[ BOOKINGS & ACTIVITY ]</div>
                        <h2 className="text-xl font-black tracking-tight">Your Active Bookings</h2>
                    </div>

                    <div className="space-y-3">
                        <div className="border border-neutral-200 rounded-2xl p-4 bg-neutral-50 space-y-2">
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] font-mono bg-[#FFD600] text-black px-2 py-0.5 font-bold">CONFIRMED</span>
                                <span className="text-xs font-bold">Order #9924</span>
                            </div>
                            <h4 className="font-black text-sm">Luxury Fragrance Box & Hot Meal Delivery</h4>
                            <p className="text-[10px] text-neutral-500">Scheduled for Today • 04:30 PM</p>
                        </div>

                        <div className="border border-neutral-200 rounded-2xl p-4 bg-neutral-50 space-y-2 opacity-75">
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] font-mono bg-neutral-200 text-neutral-700 px-2 py-0.5 font-bold">COMPLETED</span>
                                <span className="text-xs font-bold">Order #8810</span>
                            </div>
                            <h4 className="font-black text-sm">Advanced Cambridge Course Materials</h4>
                            <p className="text-[10px] text-neutral-500">Delivered on August 8th</p>
                        </div>
                    </div>
                </div>
            );
        }

        // PROFILE VIEW
        function ProfileView({ userName, heroImage, onLogout }) {
            return (
                <div className="p-6 space-y-6">
                    <div className="flex items-center space-x-4 border-b border-neutral-100 pb-6">
                        <div className="w-16 h-16 rounded-full bg-black text-[#FFD600] font-black flex items-center justify-center text-xl overflow-hidden border-2 border-black shadow-md">
                            {heroImage ? <img src={heroImage} className="w-full h-full object-cover" /> : userName[0]}
                        </div>
                        <div>
                            <h2 className="font-black text-lg tracking-tight">{userName}</h2>
                            <p className="text-xs text-neutral-500">Cambridge Student ID: #CAM-88293</p>
                            <span className="inline-block mt-1 bg-[#FFD600] text-black font-mono text-[9px] px-2 py-0.5 font-bold uppercase">
                                Premium Member & Scholar
                            </span>
                        </div>
                    </div>

                    <div className="space-y-2">
                        <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest">[ ACCOUNT SETTINGS ]</div>
                        <div className="bg-neutral-50 border border-neutral-200 rounded-2xl overflow-hidden divide-y divide-neutral-200 text-xs font-bold">
                            <div className="p-4 hover:bg-neutral-100 cursor-pointer flex justify-between items-center">
                                <span>Edit Personal Profile</span>
                                <span className="text-neutral-400">→</span>
                            </div>
                            <div className="p-4 hover:bg-neutral-100 cursor-pointer flex justify-between items-center">
                                <span>Notification Preferences</span>
                                <span className="text-neutral-400">→</span>
                            </div>
                            <div className="p-4 hover:bg-neutral-100 cursor-pointer flex justify-between items-center">
                                <span>Privacy & Security</span>
                                <span className="text-neutral-400">→</span>
                            </div>
                            <div className="p-4 hover:bg-neutral-100 cursor-pointer flex justify-between items-center">
                                <span>Help & Support</span>
                                <span className="text-neutral-400">→</span>
                            </div>
                        </div>
                    </div>

                    <button 
                        onClick={onLogout}
                        className="w-full border-2 border-black text-black font-black py-3 rounded-2xl text-xs hover:bg-black hover:text-white transition-all shadow-sm"
                    >
                        LOG OUT SECURELY
                    </button>
                </div>
            );
        }

        // Subviews for detailed cards
        function AcademicsView({ onBack }) {
            return (
                <div className="p-6 space-y-4 animate-fadeIn">
                    <button onClick={onBack} className="text-xs font-mono font-bold text-neutral-500 hover:text-black">← BACK TO HOME</button>
                    <h2 className="text-xl font-black">Hot Meals & Culinary Selection</h2>
                    <div className="space-y-3">
                        {['Artisanal Burger & Truffle Fries', 'Sourced Organic Salad Bowl', 'Chef Special Gourmet Pasta'].map((c, i) => (
                            <div key={i} className="border border-neutral-200 rounded-2xl p-4 bg-neutral-50 space-y-1">
                                <span className="text-[10px] font-mono text-neutral-400">[ ITEM 0{i+1} ]</span>
                                <h4 className="font-bold text-sm">{c}</h4>
                                <div className="flex justify-between text-[10px] text-neutral-500 pt-2">
                                    <span>Fastest Sourceding</span>
                                    <span className="font-bold text-black">Available</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function EventsView({ onBack }) {
            return (
                <div className="p-6 space-y-4 animate-fadeIn">
                    <button onClick={onBack} className="text-xs font-mono font-bold text-neutral-500 hover:text-black">← BACK TO HOME</button>
                    <h2 className="text-xl font-black">Quick Reorder History</h2>
                    <div className="space-y-3">
                        <div className="bg-[#FFD600] text-black border border-yellow-500 rounded-2xl p-4 space-y-1">
                            <span className="text-[10px] font-mono font-bold">LAST SAVED ORDER</span>
                            <h4 className="font-black text-sm">Gourmet Burger Combo & Signature Perfume</h4>
                            <p className="text-[10px] text-black/80">Delivered 3 days ago</p>
                        </div>
                    </div>
                </div>
            );
        }

        function SportsView({ onBack }) { return <div className="p-6"><button onClick={onBack} className="text-xs font-mono font-bold text-neutral-500">← BACK</button></div>; }
        
        function LibraryView({ onBack }) {
            return (
                <div className="p-6 space-y-4 animate-fadeIn">
                    <button onClick={onBack} className="text-xs font-mono font-bold text-neutral-500 hover:text-black">← BACK TO HOME</button>
                    <h2 className="text-xl font-black">Luxury Fragrances & Perfumes</h2>
                    <div className="space-y-3">
                        {['Appearich Signature Noir', 'Golden Amber Essence', 'Cambridge Botanical Elegance'].map((lib, i) => (
                            <div key={i} className="border border-neutral-200 rounded-2xl p-4 bg-neutral-50 flex justify-between items-center">
                                <div>
                                    <span className="text-[10px] font-mono text-neutral-400">[ FRAGRANCE VAULT ]</span>
                                    <h4 className="font-bold text-sm mt-0.5">{lib}</h4>
                                </div>
                                <span className="text-xs font-bold text-black bg-[#FFD600] px-3 py-1 rounded-xl">Select</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CommunityView({ onBack }) { return <div className="p-6"><button onClick={onBack} className="text-xs font-mono font-bold text-neutral-500">← BACK</button></div>; }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
