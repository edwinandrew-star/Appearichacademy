<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPEARICH — Future Cambridge-Inspired LMS</title>
    <!-- Google Fonts for superior editorial typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        appearichGold: '#FFD700',
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans selection:bg-[#FFD700] selection:text-black antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [userName, setUserName] = useState('William');
            const [currentTab, setCurrentTab] = useState('Home');
            const [activeSubView, setActiveSubView] = useState(null);
            const [darkMode, setDarkMode] = useState(true);

            // Persistent Hero Image State with multiple updates/deletes support & creative editorial imagery
            const [heroImage, setHeroImage] = useState('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&q=80&w=1200');
            const [isBwMode, setIsBwMode] = useState(false);
            const [showHeroMenu, setShowHeroMenu] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const handleLogin = (name) => {
                if (name.trim()) setUserName(name.trim());
                setIsLoggedIn(true);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentTab('Home');
                setActiveSubView(null);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setHeroImage(reader.result);
                        setShowHeroMenu(false);
                    };
                    reader.readAsDataURL(file);
                }
            };

            if (!isLoggedIn) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 flex flex-col justify-between shadow-2xl relative pb-28 transition-colors duration-300">
                    
                    {/* Top Header */}
                    <header className="flex justify-between items-center px-6 pt-5 pb-3 border-b border-neutral-100 dark:border-neutral-900 bg-white/80 dark:bg-neutral-950/80 backdrop-blur-md sticky top-0 z-40">
                        <div 
                            onClick={() => setActiveSubView(null)}
                            className="w-10 h-10 rounded-full border border-neutral-200 dark:border-neutral-800 flex items-center justify-center cursor-pointer hover:bg-neutral-100 dark:hover:bg-neutral-900 shadow-sm text-sm font-bold transition-all"
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" /></svg>
                        </div>
                        <div className="flex items-center space-x-2 font-black text-lg tracking-tight">
                            <span className="w-6 h-6 bg-black dark:bg-[#FFD700] text-[#FFD700] dark:text-black rounded-lg flex items-center justify-center text-xs shadow-sm font-mono font-bold">A</span>
                            <span className="font-extrabold tracking-wider font-mono">APPEARICH</span>
                        </div>
                        <div className="flex items-center space-x-2">
                            <button 
                                onClick={() => setIsBwMode(!isBwMode)}
                                className={`px-2.5 h-9 rounded-full border border-neutral-200 dark:border-neutral-800 flex items-center justify-center text-[10px] font-mono font-bold transition-colors ${isBwMode ? 'bg-neutral-900 text-white border-black' : 'hover:bg-neutral-100 dark:hover:bg-neutral-900'}`}
                                title="Toggle B&W Mode"
                            >
                                MONO
                            </button>
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="w-9 h-9 rounded-full border border-neutral-200 dark:border-neutral-800 flex items-center justify-center text-xs hover:bg-neutral-100 dark:hover:bg-neutral-900 transition-colors"
                            >
                                {darkMode ? 'LIGHT' : 'DARK'}
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-y-auto">
                        {currentTab === 'Home' && !activeSubView && (
                            <HomeScreen 
                                userName={userName} 
                                heroImage={heroImage} 
                                isBwMode={isBwMode}
                                showHeroMenu={showHeroMenu}
                                setShowHeroMenu={setShowHeroMenu}
                                fileInputRef={fileInputRef}
                                handleImageUpload={handleImageUpload}
                                setHeroImage={setHeroImage}
                                setActiveSubView={setActiveSubView}
                            />
                        )}

                        {currentTab === 'Home' && activeSubView === 'academics' && <AcademicsView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'events' && <EventsView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'sports' && <SportsView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'library' && <LibraryView onBack={() => setActiveSubView(null)} />}
                        {currentTab === 'Home' && activeSubView === 'community' && <CommunityView onBack={() => setActiveSubView(null)} />}

                        {currentTab === 'AI' && <AICampanionView userName={userName} />}
                        {currentTab === 'Activity' && <ActivityJourneyView />}
                        {currentTab === 'Profile' && <ProfileView userName={userName} heroImage={heroImage} onLogout={handleLogout} />}
                    </main>

                    {/* Hidden file input for hero management */}
                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />

                    {/* Creative Bottom Navigation Bar (No Emojis) */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white/90 dark:bg-neutral-950/90 backdrop-blur-lg border-t border-neutral-200 dark:border-neutral-900 px-4 py-3 flex justify-around items-center z-30 shadow-2xl">
                        {[
                            { name: 'Home', label: 'CAMPUS' },
                            { name: 'AI', label: 'MENTOR' },
                            { name: 'Activity', label: 'JOURNEY' },
                            { name: 'Profile', label: 'DOSSIER' }
                        ].map((tab) => (
                            <button 
                                key={tab.name}
                                onClick={() => { setCurrentTab(tab.name); setActiveSubView(null); }}
                                className={`flex flex-col items-center space-y-1 transition-all py-1 px-3 rounded-xl ${currentTab === tab.name ? 'bg-[#FFD700] text-black font-black shadow-md scale-105' : 'text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200'}`}
                            >
                                <span className="text-[10px] tracking-widest font-mono">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                </div>
            );
        }

        // LOGIN SCREEN
        function LoginScreen({ onLogin }) {
            const [nameInput, setNameInput] = useState('William');

            return (
                <div className="max-w-md mx-auto min-h-screen bg-black text-white flex flex-col justify-between p-8 relative overflow-hidden font-sans">
                    <div className="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-[#FFD700]/10 blur-3xl pointer-events-none"></div>
                    
                    <div className="space-y-3 pt-12 z-10">
                        <div className="inline-block bg-[#FFD700] text-black font-mono text-[10px] px-2.5 py-1 font-extrabold rounded">
                            CAMBRIDGE DIGITAL OS v3.0
                        </div>
                        <h1 className="text-5xl font-black tracking-tighter leading-none text-white font-mono">
                            APPEARICH<span className="text-[#FFD700]">.</span>
                        </h1>
                        <p className="text-xs text-neutral-400 font-medium pt-1">
                            The Future of University Learning. Immersive intelligence, 3D architecture, and academic prestige.
                        </p>
                    </div>

                    <div className="space-y-6 z-10 my-auto">
                        <div className="space-y-2">
                            <label className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest">Enter Student Name</label>
                            <input 
                                type="text"
                                value={nameInput}
                                onChange={(e) => setNameInput(e.target.value)}
                                placeholder="e.g. William"
                                className="w-full bg-neutral-900 border border-neutral-800 rounded-2xl px-5 py-4 text-white font-bold text-base focus:outline-none focus:border-[#FFD700] transition-colors"
                            />
                        </div>
                        <button 
                            onClick={() => onLogin(nameInput)}
                            className="w-full bg-[#FFD700] text-black font-black py-4 rounded-2xl tracking-wider text-xs hover:bg-white transition-all shadow-xl shadow-[#FFD700]/10 flex items-center justify-center space-x-2 font-mono uppercase"
                        >
                            <span>Enter Campus Environment</span>
                            <span>→</span>
                        </button>
                    </div>

                    <div className="text-center text-[9px] font-mono text-neutral-600 z-10 uppercase tracking-widest">
                        Secured by Cambridge Academic Protocol
                    </div>
                </div>
            );
        }

        // HOME SCREEN
        function HomeScreen({ 
            userName, 
            heroImage, 
            isBwMode,
            showHeroMenu, 
            setShowHeroMenu, 
            fileInputRef, 
            setHeroImage,
            setActiveSubView 
        }) {
            const [searchQuery, setSearchQuery] = useState('');
            const [isSearchFocused, setIsSearchFocused] = useState(false);

            return (
                <div className="px-5 py-4 space-y-6 animate-fadeIn">
                    
                    {/* Heroic Personal Image Environment with Creative Cover Menu */}
                    <div className="relative rounded-3xl overflow-hidden bg-neutral-900 text-white shadow-2xl h-60 flex flex-col justify-end group border border-neutral-800">
                        {heroImage ? (
                            <img 
                                src={heroImage} 
                                className={`absolute inset-0 w-full h-full object-cover transition-all duration-700 group-hover:scale-105 ${isBwMode ? 'grayscale contrast-125' : 'opacity-85'}`} 
                            />
                        ) : (
                            <div className="absolute inset-0 bg-gradient-to-br from-neutral-900 to-neutral-800"></div>
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent"></div>
                        
                        {/* Change Cover Management Menu */}
                        <div className="absolute top-4 right-4 z-20">
                            <button 
                                onClick={() => setShowHeroMenu(!showHeroMenu)}
                                className="bg-black/80 backdrop-blur-md border border-white/20 text-white text-[10px] font-mono px-3.5 py-2 rounded-full hover:bg-black transition-all flex items-center space-x-1.5 shadow-xl uppercase font-semibold"
                            >
                                <span>Manage Visual</span>
                            </button>

                            {showHeroMenu && (
                                <div className="absolute right-0 mt-2 w-52 bg-neutral-900 border border-neutral-800 rounded-2xl shadow-2xl py-2 z-30 text-xs font-medium space-y-1">
                                    <button 
                                        onClick={() => { fileInputRef.current.click(); setShowHeroMenu(false); }}
                                        className="w-full text-left px-4 py-2.5 hover:bg-neutral-800 text-white flex items-center space-x-2 transition-colors font-mono text-[11px]"
                                    >
                                        <span>Upload / Replace Image</span>
                                    </button>
                                    <button 
                                        onClick={() => { setHeroImage(''); setShowHeroMenu(false); }}
                                        className="w-full text-left px-4 py-2.5 hover:bg-neutral-800 text-red-400 flex items-center space-x-2 transition-colors font-mono text-[11px]"
                                    >
                                        <span>Remove Image</span>
                                    </button>
                                    <button 
                                        onClick={() => { setHeroImage('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&q=80&w=1200'); setShowHeroMenu(false); }}
                                        className="w-full text-left px-4 py-2.5 hover:bg-neutral-800 text-[#FFD700] flex items-center space-x-2 transition-colors font-mono text-[11px]"
                                    >
                                        <span>Restore Default</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Personalized Greeting */}
                        <div className="relative z-10 p-6 space-y-2">
                            <div className="inline-block bg-[#FFD700] text-black font-mono text-[9px] px-2 py-0.5 font-extrabold uppercase tracking-widest rounded">
                                CAMBRIDGE SCHOLAR
                            </div>
                            <h1 className="text-2xl font-black tracking-tight text-white uppercase font-mono">
                                WELCOME, {userName}
                            </h1>
                            <p className="text-xs text-[#FFD700] font-medium tracking-wide">
                                Ready to continue your academic journey?
                            </p>
                        </div>
                    </div>

                    {/* Futuristic Search Bar */}
                    <div className="relative">
                        <div className={`flex items-center border rounded-2xl bg-neutral-50 dark:bg-neutral-900 px-4 py-3.5 space-x-3 transition-all duration-300 ${isSearchFocused ? 'border-[#FFD700] shadow-lg shadow-[#FFD700]/5 ring-1 ring-[#FFD700]' : 'border-neutral-200 dark:border-neutral-800'}`}>
                            <span className="text-neutral-400 text-xs font-mono font-bold">[SEARCH]</span>
                            <input 
                                type="text" 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                onFocus={() => setIsSearchFocused(true)}
                                onBlur={() => setIsSearchFocused(false)}
                                placeholder="Search your academic world..."
                                className="bg-transparent text-xs flex-1 focus:outline-none text-neutral-900 dark:text-neutral-100 placeholder:text-neutral-400 font-medium"
                            />
                            {searchQuery && (
                                <button onClick={() => setSearchQuery('')} className="text-xs text-neutral-400 hover:text-neutral-600 font-mono">CLEAR</button>
                            )}
                        </div>
                    </div>

                    {/* Academic Command Center: Creative Cards Arrangement */}
                    <div className="space-y-4">
                        <div className="flex justify-between items-center px-1">
                            <span className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest">[ COMMAND CENTER ]</span>
                            <span className="text-[10px] font-mono text-[#FFD700]">CAMBRIDGE CULTURE</span>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            {/* Academic Card with Creative Imagery */}
                            <div 
                                onClick={() => setActiveSubView('academics')}
                                className="relative rounded-3xl overflow-hidden h-44 bg-neutral-900 p-4 flex flex-col justify-end shadow-md cursor-pointer group border border-neutral-800"
                            >
                                <div className="absolute inset-0 bg-cover bg-center opacity-40 group-hover:scale-105 transition-transform duration-500" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&q=80&w=600')` }}></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent"></div>
                                <div className="relative z-10 space-y-1">
                                    <span className="text-[9px] font-mono text-[#FFD700] font-bold">MODULE 01</span>
                                    <h3 className="font-black text-base text-white">Academics</h3>
                                    <p className="text-[10px] text-neutral-300 font-medium">Courses & Lectures</p>
                                </div>
                            </div>

                            {/* Upcoming Events Card with Creative Imagery */}
                            <div 
                                onClick={() => setActiveSubView('events')}
                                className="relative rounded-3xl overflow-hidden h-44 bg-neutral-900 p-4 flex flex-col justify-end shadow-md cursor-pointer group border border-neutral-800"
                            >
                                <div className="absolute inset-0 bg-cover bg-center opacity-40 group-hover:scale-105 transition-transform duration-500" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&q=80&w=600')` }}></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent"></div>
                                <div className="relative z-10 space-y-1">
                                    <span className="text-[9px] font-mono text-[#FFD700] font-bold">SCHEDULE</span>
                                    <h3 className="font-black text-base text-white">Upcoming Events</h3>
                                    <p className="text-[10px] text-neutral-300 font-medium">Seminars & Deadlines</p>
                                </div>
                            </div>
                        </div>

                        {/* Secondary Interactive Horizontal Banner Cards */}
                        <div className="space-y-3">
                            <div 
                                onClick={() => setActiveSubView('sports')}
                                className="bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-[#FFD700] transition-all group"
                            >
                                <div className="flex items-center space-x-3.5">
                                    <div className="w-10 h-10 rounded-xl bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center text-xs font-mono font-bold">ATH</div>
                                    <div>
                                        <h4 className="font-black text-xs">University Sports & Fitness</h4>
                                        <p className="text-[10px] text-neutral-500 dark:text-neutral-400">Upcoming matches & training schedules</p>
                                    </div>
                                </div>
                                <span className="text-xs font-mono text-neutral-400 group-hover:translate-x-1 transition-transform">→</span>
                            </div>

                            <div 
                                onClick={() => setActiveSubView('library')}
                                className="bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-[#FFD700] transition-all group"
                            >
                                <div className="flex items-center space-x-3.5">
                                    <div className="w-10 h-10 rounded-xl bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center text-xs font-mono font-bold">LIB</div>
                                    <div>
                                        <h4 className="font-black text-xs">Digital Library & Resources</h4>
                                        <p className="text-[10px] text-neutral-500 dark:text-neutral-400">Research papers, books & notes</p>
                                    </div>
                                </div>
                                <span className="text-xs font-mono text-neutral-400 group-hover:translate-x-1 transition-transform">→</span>
                            </div>

                            <div 
                                onClick={() => setActiveSubView('community')}
                                className="bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-[#FFD700] transition-all group"
                            >
                                <div className="flex items-center space-x-3.5">
                                    <div className="w-10 h-10 rounded-xl bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center text-xs font-mono font-bold">COM</div>
                                    <div>
                                        <h4 className="font-black text-xs">Student Community & Societies</h4>
                                        <p className="text-[10px] text-neutral-500 dark:text-neutral-400">Discussions and academic groups</p>
                                    </div>
                                </div>
                                <span className="text-xs font-mono text-neutral-400 group-hover:translate-x-1 transition-transform">→</span>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        // AI COMPANION VIEW
        function AICampanionView({ userName }) {
            const [messages, setMessages] = useState([
                { sender: 'ai', text: `Hello ${userName}. I'm your Cambridge AI Academic Mentor. You've improved your mathematics performance by 18% this month. I recommend revisiting integration before Friday's lecture.` }
            ]);
            const [input, setInput] = useState('');

            const handleSend = () => {
                if (!input.trim()) return;
                const userMsg = input;
                setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setInput('');

                setTimeout(() => {
                    setMessages(prev => [
                        ...prev, 
                        { sender: 'ai', text: `Analyzing "${userMsg}" through our Cambridge curriculum model. Based on your learning telemetry, let's break this down into key conceptual milestones...` }
                    ]);
                }, 800);
            };

            return (
                <div className="p-6 space-y-6 flex flex-col h-[calc(100vh-120px)] justify-between animate-fadeIn">
                    <div className="space-y-4">
                        <div className="flex items-center justify-between border-b border-neutral-200 dark:border-neutral-900 pb-3">
                            <div className="flex items-center space-x-2">
                                <div className="w-2.5 h-2.5 rounded-full bg-[#FFD700] animate-pulse"></div>
                                <h2 className="font-black text-xs tracking-widest uppercase font-mono">APPEARICH AI MENTOR</h2>
                            </div>
                            <span className="text-[9px] font-mono bg-neutral-100 dark:bg-neutral-900 px-2 py-0.5 rounded text-neutral-500">SOCRATIC v3</span>
                        </div>

                        {/* AI Core Interactive Banner */}
                        <div className="bg-black text-white rounded-3xl p-6 text-center relative overflow-hidden shadow-xl space-y-3 border border-neutral-800">
                            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-neutral-800 via-black to-black opacity-50"></div>
                            <div className="relative z-10 w-14 h-14 mx-auto rounded-full bg-[#FFD700]/20 border border-[#FFD700] flex items-center justify-center animate-pulse shadow-lg shadow-[#FFD700]/10 font-mono font-black text-[#FFD700]">
                                AI
                            </div>
                            <div className="relative z-10">
                                <h4 className="font-black text-xs text-[#FFD700] tracking-wider uppercase font-mono">KNOWLEDGE TELEMETRY ACTIVE</h4>
                                <p className="text-[10px] text-neutral-400 mt-0.5">Real-time learning optimization in progress</p>
                            </div>
                        </div>

                        {/* Chat Messages */}
                        <div className="space-y-3 overflow-y-auto max-h-56 pr-1">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-2xl p-4 text-xs font-medium leading-relaxed ${m.sender === 'user' ? 'bg-[#FFD700] text-black font-bold shadow-md' : 'bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-800'}`}>
                                        <div className="text-[9px] font-mono opacity-60 mb-1 uppercase">{m.sender === 'user' ? userName : 'AI MENTOR'}</div>
                                        {m.text}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Input Bar with Creative Button */}
                    <div className="pt-2">
                        <div className="flex items-center border border-neutral-200 dark:border-neutral-800 rounded-2xl bg-neutral-50 dark:bg-neutral-900 px-3 py-2 space-x-2 focus-within:border-[#FFD700] transition-colors">
                            <input 
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                                placeholder="Ask about concepts, schedules, or feedback..."
                                className="bg-transparent text-xs flex-1 focus:outline-none text-neutral-900 dark:text-neutral-100 placeholder:text-neutral-400"
                            />
                            <button 
                                onClick={handleSend}
                                className="bg-[#FFD700] text-black font-mono font-black text-[10px] uppercase tracking-wider px-4 py-2.5 rounded-xl hover:bg-white transition-all shadow-sm"
                            >
                                Query AI
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ACTIVITY JOURNEY VIEW
        function ActivityJourneyView() {
            return (
                <div className="p-6 space-y-6 animate-fadeIn">
