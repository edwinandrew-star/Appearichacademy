<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPEARICH — Learn. Explore. Level Up.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        electric: '#FFD600',
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-neutral-100 text-black font-sans selection:bg-[#FFD600] selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [currentTab, setCurrentTab] = useState('Home');
            const [studentName] = useState('William');
            const [aiInput, setAiInput] = useState('');

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white text-black flex flex-col justify-between shadow-2xl relative pb-20">
                    
                    {/* Top Bar */}
                    <header className="flex justify-between items-center px-6 pt-6 pb-4">
                        <div className="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center cursor-pointer hover:bg-neutral-50">
                            ←
                        </div>
                        <div className="flex items-center space-x-2 font-black text-lg tracking-tight">
                            <span className="w-5 h-5 bg-black text-[#FFD600] flex items-center justify-center text-xs">◆</span>
                            <span>Appearich</span>
                        </div>
                        <div className="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center cursor-pointer hover:bg-neutral-50">
                            🌙
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="px-6 flex-1 space-y-6 pb-6 overflow-y-auto">
                        
                        {/* Hero Welcome Card */}
                        <div className="relative rounded-3xl overflow-hidden bg-neutral-900 text-white p-6 shadow-lg h-48 flex flex-col justify-end">
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-0"></div>
                            <div className="absolute top-4 right-4 bg-[#FFD600] text-black font-mono text-[10px] px-2 py-0.5 font-bold z-10">
                                [ DIGITAL CAMPUS ]
                            </div>
                            <div className="relative z-10 space-y-1">
                                <h1 className="text-2xl font-black tracking-tight">Welcome, {studentName}!</h1>
                                <p className="text-xs text-neutral-300 font-medium">
                                    Appearich — Cambridge Learning, Delivered with Academic Excellence.
                                </p>
                            </div>
                        </div>

                        {/* We Offer This Section */}
                        <div className="space-y-3">
                            <div className="flex items-center space-x-2 text-xs font-black tracking-wider uppercase">
                                <span>📚</span>
                                <span>WE OFFER THIS</span>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div className="relative rounded-2xl overflow-hidden h-36 bg-neutral-900 text-white p-4 flex flex-col justify-end shadow-md cursor-pointer group">
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent z-0"></div>
                                    <div className="relative z-10">
                                        <h3 className="font-black text-base group-hover:text-[#FFD600] transition-colors">Digital Labs</h3>
                                        <p className="text-[10px] text-neutral-300 mt-0.5">3D Physics & Bio Simulations</p>
                                    </div>
                                </div>

                                <div className="relative rounded-2xl overflow-hidden h-36 bg-neutral-900 text-white p-4 flex flex-col justify-end shadow-md cursor-pointer group">
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent z-0"></div>
                                    <div className="relative z-10">
                                        <h3 className="font-black text-base group-hover:text-[#FFD600] transition-colors">Knowledge Vault</h3>
                                        <p className="text-[10px] text-neutral-300 mt-0.5">Cambridge Notes & Past Papers</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Need Anything Specific? (AI Prompt Card) */}
                        <div className="bg-white border border-neutral-200 rounded-3xl p-5 shadow-sm space-y-3">
                            <div className="flex items-center space-x-2 text-xs font-bold">
                                <span>❓</span>
                                <span>Need Anything Specific?</span>
                            </div>
                            <p className="text-xs text-neutral-500 leading-relaxed">
                                Describe your study goals, request custom practice questions, or ask the AI tutor anything directly.
                            </p>
                            <div className="flex items-center border border-neutral-200 rounded-2xl bg-neutral-50 px-3 py-2 space-x-2">
                                <input 
                                    type="text" 
                                    value={aiInput}
                                    onChange={(e) => setAiInput(e.target.value)}
                                    placeholder="Type your request here..."
                                    className="bg-transparent text-xs flex-1 focus:outline-none text-black"
                                />
                                <button className="bg-[#FFD600] text-black font-black text-xs px-4 py-2 rounded-xl hover:bg-black hover:text-white transition-all">
                                    Ask
                                </button>
                            </div>
                        </div>

                        {/* Quick Reorder / Quick Resume Card */}
                        <div className="bg-white border border-neutral-200 rounded-3xl p-5 shadow-sm flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-2xl bg-[#FFD600]/20 text-black font-black flex items-center justify-center text-sm">
                                    ⚡
                                </div>
                                <div>
                                    <h4 className="font-black text-sm">Quick Resume</h4>
                                    <p className="text-[10px] text-neutral-500 mt-0.5">Repeat your last active study session instantly</p>
                                </div>
                            </div>
                            <button className="border border-neutral-300 px-4 py-2 rounded-2xl text-xs font-bold hover:border-black hover:bg-black hover:text-white transition-all">
                                Resume
                            </button>
                        </div>

                    </main>

                    {/* Bottom Mobile Navigation Bar */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-neutral-200 px-6 py-3 flex justify-between items-center z-20">
                        {[
                            { name: 'Home', icon: '🏠' },
                            { name: 'AI Guide', icon: '🤖' },
                            { name: 'Bookings', icon: '💼' },
                            { name: 'Profile', icon: '👤' }
                        ].map((tab) => (
                            <button 
                                key={tab.name}
                                onClick={() => setCurrentTab(tab.name)}
                                className={`flex flex-col items-center space-y-1 transition-colors ${currentTab === tab.name ? 'text-[#FFD600] font-bold' : 'text-neutral-400 hover:text-black'}`}
                            >
                                <span className="text-lg">{tab.icon}</span>
                                <span className="text-[10px]">{tab.name}</span>
                            </button>
                        ))}
                    </nav>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
